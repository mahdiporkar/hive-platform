spring.application.name=hive-authorization
server.port=${HIVE_AUTHORIZATION_PORT:8082}
spring.datasource.url=${HIVE_DB_URL}
spring.datasource.username=${HIVE_DB_USER}
spring.datasource.password=${HIVE_DB_PASSWORD}
spring.flyway.locations=classpath:db/migration
hive.openfga.url=${HIVE_OPENFGA_URL}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,openfga
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
hive.internal.password=${HIVE_INTERNAL_PASSWORD:}
hive.provisioning.password=${HIVE_PROVISIONING_PASSWORD:}
hive.identity.allowed-origins=${HIVE_IDP_ALLOWED_ORIGINS:}
hive.identity.primary-issuer=${HIVE_PRIMARY_ISSUER:}
hive.identity.allow-local-http=${HIVE_IDP_ALLOW_LOCAL_HTTP:false}