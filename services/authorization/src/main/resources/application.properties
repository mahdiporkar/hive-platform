spring.application.name=hive-authorization
server.port=${HIVE_AUTHORIZATION_PORT:8082}
spring.datasource.url=${HIVE_DB_URL}
spring.datasource.username=${HIVE_DB_USER}
spring.datasource.password=${HIVE_DB_PASSWORD}
spring.flyway.locations=classpath:db/migration
hive.openfga.url=${HIVE_OPENFGA_URL}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,openfga
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
hive.internal.password=${HIVE_INTERNAL_PASSWORD:}
hive.provisioning.password=${HIVE_PROVISIONING_PASSWORD:}
hive.identity.allowed-origins=${HIVE_IDP_ALLOWED_ORIGINS:}
hive.identity.primary-issuer=${HIVE_PRIMARY_ISSUER:}
hive.identity.allow-local-http=${HIVE_IDP_ALLOW_LOCAL_HTTP:false}
hive.openfga.store-name=${HIVE_OPENFGA_STORE_NAME:hive}
hive.openfga.store-id=${HIVE_OPENFGA_STORE_ID:}
hive.openfga.api-token=${HIVE_OPENFGA_API_TOKEN:}
hive.authorization.cache.enabled=${HIVE_AUTHZ_CACHE_ENABLED:false}
hive.authorization.cache.ttl=${HIVE_AUTHZ_CACHE_TTL:5s}
management.health.redis.enabled=${HIVE_AUTHZ_CACHE_ENABLED:false}
spring.data.redis.host=${HIVE_REDIS_HOST:localhost}
spring.data.redis.port=${HIVE_REDIS_PORT:6379}
spring.data.redis.password=${HIVE_REDIS_PASSWORD:}
hive.bootstrap.admin-issuer=${HIVE_BOOTSTRAP_ADMIN_ISSUER:${HIVE_PRIMARY_ISSUER:}}
hive.bootstrap.admin-subject=${HIVE_BOOTSTRAP_ADMIN_SUBJECT:}
spring.jackson.default-property-inclusion=non_null
hive.artifacts.network-policy=${HIVE_ARTIFACT_NETWORK_POLICY:PRODUCTION_INTERNET}
hive.artifacts.allow-http=${HIVE_ARTIFACT_ALLOW_HTTP:false}
hive.artifacts.require-integrity=${HIVE_ARTIFACT_REQUIRE_INTEGRITY:true}
hive.artifacts.allowed-private-cidrs=${HIVE_ARTIFACT_ALLOWED_PRIVATE_CIDRS:}
hive.artifacts.development-host=${HIVE_ARTIFACT_DEVELOPMENT_HOST:}
hive.targets.network-policy=${HIVE_TARGET_NETWORK_POLICY:UNRESTRICTED}
hive.targets.allow-http=${HIVE_TARGET_ALLOW_HTTP:false}
hive.targets.allowed-private-cidrs=${HIVE_TARGET_ALLOWED_PRIVATE_CIDRS:}
