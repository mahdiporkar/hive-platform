spring.application.name=hive-bff
server.port=${HIVE_BFF_PORT:8081}
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
server.servlet.session.cookie.name=HIVE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
hive.identity.enabled=${HIVE_IDENTITY_ENABLED:false}
hive.identity.issuer=${HIVE_OIDC_ISSUER:}
hive.identity.client-id=${HIVE_OIDC_CLIENT_ID:}
hive.identity.client-secret=${HIVE_OIDC_CLIENT_SECRET:}
hive.identity.allow-local-http=${HIVE_OIDC_ALLOW_LOCAL_HTTP:false}
hive.vault.key-id=${HIVE_VAULT_KEY_ID:current}
hive.vault.key=${HIVE_VAULT_KEY:}
spring.data.redis.host=${HIVE_REDIS_HOST:localhost}
spring.data.redis.port=${HIVE_REDIS_PORT:6379}
spring.data.redis.password=${HIVE_REDIS_PASSWORD:}
spring.session.redis.namespace=hive:session
logging.level.root=INFO
