name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts-and-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: ./mvnw -B verify
      - run: npm run test:bootstrap
      - run: npx playwright install --with-deps chromium
      - run: npm run test:identity
      - run: npm run test:model
      - run: npm run test:authorization
      - run: npm run test:manifests
      - run: npm run test:routing
      - run: npm run build:examples
      - run: npm run test:e2e:mfe
      - run: npm run test:e2e:workspace
      - run: npm run build:console
      - run: npm run test:e2e:console
      - run: npm run test:e2e:api-admin
      - run: npm run build:shell
      - run: npm run test:e2e:public-hybrid
      - run: npm run test:cli
      - run: npm run test:cli:up
      - run: npm run test:keycloak
