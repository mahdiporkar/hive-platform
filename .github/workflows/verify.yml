# Hive's full verification: contracts, services, integration, end-to-end, compose and architecture tests.
# Runs on pull requests and on pushes to any branch except develop; on develop the demo pipeline (deploy-demo.yml)
# calls it before building and deploying, so a failing test blocks the deployment.
name: Verify
on:
  pull_request:
  push:
    branches-ignore: [develop]
  workflow_call:
    inputs:
      ref:
        description: 'Commit to verify (default: the triggering commit)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  migrations:
    name: Migration guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ inputs.ref || github.sha }}", fetch-depth: 0}
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - name: Applied migrations are append-only and backward compatible
        run: node deploy/check-migrations.mjs "${{ github.event.pull_request.base.sha || github.event.before || '' }}"

  contracts-and-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ inputs.ref || github.sha }}"}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: ./mvnw -B verify
      - run: npm run test:bootstrap
      - run: npx playwright install --with-deps chromium
      - run: npm run test:identity
      - run: npm run test:model
      - run: npm run test:authorization
      - run: npm run test:manifests
      - run: npm run test:routing
      - run: npm run test:superset
      - run: npm run build:examples
      - run: npm run test:e2e:mfe
      - run: npm run test:e2e:workspace
      - run: npm run build:console
      - run: npm run test:e2e:console
      - run: npm run test:e2e:api-admin
      - run: npm run build:shell
      - run: npm run test:e2e:public-hybrid
      - run: npm run test:cli
      - run: npm run test:cli:up
      - run: npm run test:keycloak
      - run: npm run test:hardening
      - run: npm run test:e2e:golden
      - run: npm run verify:compose
      - run: npm run test:architecture
      - run: npm run test:log-scan
