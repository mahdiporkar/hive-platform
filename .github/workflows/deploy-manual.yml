# Deploys (or redeploys) a chosen commit to the demo on request: Actions → "Deploy demo (manual)" → Run workflow.
# Typical uses: redeploy the current version, roll back to an earlier commit, deploy a commit from another branch.
# Existing images of the commit are reused; missing ones are built after the tests pass.
name: Deploy demo (manual)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, branch or tag to deploy
        required: true
        default: develop
      components:
        description: What to deploy
        type: choice
        options: [affected, all, authorization, bff, console]
        default: affected
      run_tests:
        description: Run the full test suite first (images that already exist were tested when they were built)
        type: boolean
        default: true
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy-demo-hive-platform
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      components: ${{ steps.affected.outputs.components }}
    steps:
      - uses: actions/checkout@v7
        with: {ref: "${{ inputs.ref }}", fetch-depth: 0}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with: {node-version: 22}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: affected
        env: {IMAGE_PREFIX: "ghcr.io/${{ github.repository }}"}
        run: |
          export IMAGE_PREFIX="${IMAGE_PREFIX,,}"
          components=$(node deploy/affected.mjs "${{ steps.sha.outputs.sha }}" "${{ inputs.components }}")
          echo "components=$components" >> "$GITHUB_OUTPUT"
          echo "### Manual deployment of \`${{ inputs.ref }}\` (${{ steps.sha.outputs.sha }}): ${components:-nothing to deploy}" >> "$GITHUB_STEP_SUMMARY"

  ci:
    name: Verify
    needs: resolve
    if: inputs.run_tests
    uses: ./.github/workflows/verify.yml
    with: {ref: "${{ needs.resolve.outputs.sha }}"}

  images:
    name: Images
    needs: [resolve, ci]
    if: always() && needs.resolve.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    uses: ./.github/workflows/images.yml
    with: {sha: "${{ needs.resolve.outputs.sha }}", components: "${{ needs.resolve.outputs.components }}"}

  deploy:
    name: Demo
    needs: [resolve, images]
    if: always() && needs.images.result == 'success'
    uses: ./.github/workflows/deploy-caprover.yml
    with: {sha: "${{ needs.resolve.outputs.sha }}", components: "${{ needs.resolve.outputs.components }}", reason: "manual deployment of ${{ inputs.ref }} by ${{ github.actor }}"}
    secrets: inherit
