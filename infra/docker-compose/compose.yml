# Local verification dependencies. Java services run as host processes in test:bootstrap.
name: hive
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: hive
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: ${HIVE_DB_PASSWORD:?HIVE_DB_PASSWORD is required}
    volumes: [database:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${HIVE_DB_PORT:-15432}:5432"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U hive -d hive]
      interval: 2s
      timeout: 2s
      retries: 30
  graph-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: hive_graph
      POSTGRES_USER: hive_graph
      POSTGRES_PASSWORD: ${HIVE_GRAPH_PASSWORD:?HIVE_GRAPH_PASSWORD is required}
    volumes: [graph:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U hive_graph -d hive_graph]
      interval: 2s
      timeout: 2s
      retries: 30
  graph-migrate:
    image: openfga/openfga:v1.18.1
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://hive_graph:${HIVE_GRAPH_PASSWORD:?required}@graph-db:5432/hive_graph?sslmode=disable
    depends_on:
      graph-db: {condition: service_healthy}
  openfga:
    image: openfga/openfga:v1.18.1
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://hive_graph:${HIVE_GRAPH_PASSWORD:?required}@graph-db:5432/hive_graph?sslmode=disable
      OPENFGA_PLAYGROUND_ENABLED: "false"
    depends_on:
      graph-migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:${HIVE_FGA_PORT:-18080}:8080"]
volumes:
  database:
  graph: